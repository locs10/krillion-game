<!DOCTYPE html
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krillion Dive — 1,000+ Prompts</title>
  <style>
    :root {
      --bg: #071b26;
      --card: rgba(14, 45, 63, 0.9);
      --card-2: rgba(9, 32, 46, 0.92);
      --text: #eef8ff;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --muted: #9ec5db;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      overflow-x: hidden;
      background: linear-gradient(180deg, #0e4a6e 0%, #072638 45%, #03111a 80%, #01060a 100%);
      transition: background-position 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      background-size: 100% 260%;
      background-position: 0% 0%;
    }
    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.45), rgba(56,189,248,0.12));
      border: 1px solid rgba(255,255,255,0.22);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) translateX(0) scale(0.9); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.55; }
      100% { transform: translateY(-110vh) translateX(18px) scale(1.1); opacity: 0; }
    }
    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 0.85rem;
      align-items: stretch;
    }
    .depth-track {
      position: relative;
      background: linear-gradient(180deg, rgba(14,116,144,0.35) 0%, rgba(8,47,73,0.65) 55%, rgba(2,6,23,0.92) 100%);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 0.75rem 0.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 390px;
    }
    .zone-label {
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      opacity: 0.8;
    }
    .rail {
      position: absolute;
      top: 42px;
      bottom: 42px;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.14);
      border-radius: 999px;
    }
    .diver {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 1.4rem;
      line-height: 1;
      transition: top 1.15s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s ease;
      z-index: 2;
    }
    .diver.sinking {
      transform: translate(-50%, 4px) scale(1.12);
    }
    .app {
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .app.sink-pulse {
      animation: cardSink 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cardSink {
      0% { transform: translateY(0); }
      35% { transform: translateY(12px); }
      100% { transform: translateY(0); }
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .badge {
      background: var(--card-2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }
    .stat {
      background: var(--card-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.6rem 0.75rem;
      text-align: center;
    }
    .stat .label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .stat .val {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 0.15rem;
      display: inline-block;
      transition: transform 0.35s ease, color 0.35s ease;
    }
    .stat .val.pop {
      transform: scale(1.22);
      color: var(--accent-2);
    }
    .category-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-2);
      font-weight: 700;
    }
    .prompt {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0.4rem 0 1.15rem;
      line-height: 1.3;
    }
    form {
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      padding: 0.8rem 0.95rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: var(--card-2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 0.8rem 1.15rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #03131c;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .feedback {
      margin-top: 1rem;
      min-height: 2.6rem;
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .summary ul { padding-left: 1.2rem; line-height: 1.6; }
    .summary-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <div class="layout">
    <aside class="depth-track" aria-label="Ocean depth meter">
      <span class="zone-label">Surface</span>
      <div class="rail"></div>
      <div class="diver" id="diver" title="Current Depth">🤿</div>
      <span class="zone-label">Abyss</span>
    </aside>

    <main class="app" id="app-card">
      <div class="top-bar">
        <span class="badge" id="bank-count">Prompts: loading...</span>
        <span class="badge" id="mode-badge">Daily Dive</span>
      </div>

      <div class="hud">
        <div class="stat"><span class="label">Round</span><span class="val" id="round-info">1 / 7</span></div>
        <div class="stat"><span class="label">Timer</span><span class="val" id="timer-info">25s</span></div>
        <div class="stat"><span class="label">Depth</span><span class="val" id="depth-info">0m</span></div>
      </div>

      <div id="game-view">
        <span class="category-tag" id="category-info">Category</span>
        <div class="prompt" id="prompt-text">Generating prompts...</div>
        <form id="answer-form">
          <input id="answer-input" type="text" autocomplete="off" placeholder="Type an English word matching the prompt..." required />
          <button type="submit" id="submit-btn">Dive</button>
        </form>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="summary" id="summary" hidden></div>
    </main>
  </div>
