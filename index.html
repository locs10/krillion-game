<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krillion — 100x Extreme Abyssal Plunge</title>
  <style>
    :root {
      --card: rgba(6, 24, 36, 0.88);
      --card-2: rgba(3, 14, 22, 0.94);
      --text: #f0f9ff;
      --muted: #9bc4dc;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --column-y: 0vh;
      --ui-drop: 0px;
      --ui-scale: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #010408;
    }

    .ocean-world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #000205;
    }

    .ocean-column {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 25000vh;
      background: linear-gradient(
        180deg,
        #22a2e0 0%,
        #1679ab 1.5%,
        #0d4d70 4%,
        #072c42 9%,
        #041a2b 18%,
        #020e1a 35%,
        #01070e 60%,
        #000308 85%,
        #000103 100%
      );
      transform: translateY(var(--column-y));
      transition: transform 2.2s cubic-bezier(0.12, 0.92, 0.22, 1);
      pointer-events: none;
      will-change: transform;
    }

    .surface-band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 260px;
      background: linear-gradient(180deg, rgba(186, 230, 253, 0.5), rgba(14, 116, 144, 0));
    }

    .wave-line {
      position: absolute;
      top: 120px;
      left: -25%;
      width: 150%;
      height: 44px;
      border-top: 3px solid rgba(224, 242, 254, 0.85);
      border-radius: 45%;
      background: rgba(186, 230, 253, 0.18);
      animation: waveDrift 6s ease-in-out infinite;
    }

    .wave-line.second {
      top: 136px;
      border-top-color: rgba(56, 189, 248, 0.45);
      background: rgba(34, 211, 238, 0.1);
      animation: waveDrift 9s ease-in-out infinite reverse;
    }

    @keyframes waveDrift {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(3.5%) translateY(6px); }
    }

    .depth-marker {
      position: absolute;
      left: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(186, 230, 253, 0.48);
    }

    .depth-marker::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(125, 211, 252, 0.35), rgba(125, 211, 252, 0.04));
    }

    .depth-marker.major {
      font-size: 0.95rem;
      color: rgba(34, 211, 238, 0.78);
    }

    .depth-marker.major::after {
      height: 2px;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.65), rgba(34, 211, 238, 0.05));
    }

    .rush-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .rush-lines.active { opacity: 1; }

    .streak {
      position: absolute;
      bottom: -180px;
      width: 3px;
      height: 180px;
      background: linear-gradient(0deg, rgba(186, 230, 253, 0), rgba(125, 211, 252, 0.75), rgba(255, 255, 255, 0.95));
      animation: shootUp 0.42s linear infinite;
    }

    @keyframes shootUp {
      0% { transform: translateY(180px); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }

    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bubble {
      position: absolute;
      bottom: -24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(56,189,248,0.14));
      border: 1px solid rgba(255,255,255,0.24);
      animation: riseBubble linear infinite;
    }

    .bubbles.turbo .bubble { animation-duration: 0.75s !important; }

    @keyframes riseBubble {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-115vh) translateX(14px); opacity: 0; }
    }

    .ui-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 0.85rem;
      align-items: stretch;
      transform: translateY(var(--ui-drop)) scale(var(--ui-scale));
      transition: transform 1.45s cubic-bezier(0.16, 0.92, 0.24, 1);
      will-change: transform;
    }

    .wrap.rumble { animation: abyssRumble 0.55s ease-in-out; }

    @keyframes abyssRumble {
      0%, 100% { margin-left: 0px; }
      20% { margin-left: -7px; }
      40% { margin-left: 7px; }
      60% { margin-left: -4px; }
      80% { margin-left: 4px; }
    }

    .depth-rail-box {
      position: relative;
      min-height: 390px;
      border-radius: 18px;
      padding: 0.75rem 0.25rem;
      background: rgba(4, 18, 28, 0.78);
      border: 1px solid rgba(255,255,255,0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .rail-tag {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .rail-track {
      position: absolute;
      top: 42px;
      bottom: 42px;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
    }

    .krill-diver {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 1.45rem;
      line-height: 1;
      z-index: 2;
      transition: top 2.1s cubic-bezier(0.12, 0.92, 0.22, 1), transform 0.6s ease;
    }

    .krill-diver.sink-drop {
      transform: translate(-50%, 18px) scale(1.32) rotate(12deg);
    }

    .panel {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.72);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .pill {
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.15rem;
    }

    .stat {
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 0.6rem;
      text-align: center;
    }

    .stat small {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .stat strong {
      font-size: 1.05rem;
      display: inline-block;
      margin-top: 0.15rem;
      transition: transform 0.35s ease, color 0.35s ease;
    }

    .stat strong.bump {
      transform: scale(1.3);
      color: var(--accent-2);
    }

    .cat {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-2);
    }

    .question {
      font-size: 1.32rem;
      font-weight: 700;
      margin: 0.35rem 0 1.1rem;
      line-height: 1.3;
    }

    form {
      display: flex;
      gap: 0.5rem;
    }

    input {
      flex: 1;
      padding: 0.78rem 0.95rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: var(--card-2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 0.78rem 1.15rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #03131c;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.ghost {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .suggestion-box {
      margin-top: 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--warn);
    }

    .suggestion-btn {
      padding: 0.32rem 0.72rem;
      font-size: 0.85rem;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.16);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.45);
    }

    .suggestion-btn:hover {
      background: rgba(251, 191, 36, 0.28);
    }

    .msg {
      margin-top: 0.85rem;
      min-height: 2.4rem;
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }

    .results ul {
      padding-left: 1.2rem;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="ocean-world" aria-hidden="true">
    <div class="ocean-column" id="ocean-column">
      <div class="surface-band">
        <div class="wave-line"></div>
        <div class="wave-line second"></div>
      </div>
    </div>
  </div>

  <div class="rush-lines" id="rush-lines" aria-hidden="true"></div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <div class="ui-shell">
    <div class="wrap" id="wrap">
      <aside class="depth-rail-box" aria-label="Depth meter">
        <span class="rail-tag">0m</span>
        <div class="rail-track"></div>
        <div class="krill-diver" id="krill-diver">🦐</div>
        <span class="rail-tag">700km</span>
      </aside>

      <main class="panel">
        <div class="top">
          <span class="pill" id="prompt-count">Prompts: 0</span>
          <span class="pill" id="session-mode">Daily Dive</span>
        </div>

        <div class="stats">
          <div class="stat"><small>Round</small><strong id="round-val">1 / 7</strong></div>
          <div class="stat"><small>Timer</small><strong id="timer-val">30s</strong></div>
          <div class="stat"><small>Depth</small><strong id="depth-val">0m</strong></div>
        </div>

        <div id="play-area">
          <div class="cat" id="cat-val">Category</div>
          <div class="question" id="question-val">Loading...</div>
          <form id="guess-form">
            <input id="guess-input" type="text" autocomplete="off" placeholder="Type a real-life answer..." required />
            <button type="submit" id="guess-btn">Dive</button>
          </form>
          <div class="suggestion-box" id="suggestion-box" hidden></div>
          <div class="msg" id="msg-val"></div>
        </div>

        <div class="results" id="results-area" hidden></div>
      </main>
    </div>
  </div>

      const col = document.getElementById("ocean-column");
      const landmarks = {
        1: "200m · Sunlight Zone Ends",
        3: "1,000m · Midnight Zone",
        6: "3,800m · RMS Titanic Wreck",
        10: "10,994m · Challenger Deep",
        16: "20,000m · Oceanic Crust",
        25: "40,000m · Subduction Trench",
        38: "80,000m · Upper Mantle",
        52: "150,000m · Deep Asthenosphere",
        68: "300,000m · Thermal Abyss",
        84: "500,000m · Planetary Core Edge",
        97: "700,000m · Bottom of the World"
      };

      for (let pct = 1; pct <= 99; pct += 1) {
        const m = document.createElement("div");
        const metersLabel = Math.round((pct / 100) * 700000).toLocaleString() + "m";
        if (landmarks[pct]) {
          m.className = "depth-marker major";
          m.textContent = landmarks[pct];
        } else {
          m.className = "depth-marker";
          m.textContent = `${metersLabel} · Sinking`;
        }
        m.style.top = `${pct}%`;
        col.appendChild(m);
      }
    })();

    function norm(s) {
      return s.trim().toLowerCase().replace(/\s+/g, " ");

    function editDistance(a, b) {
      if (a === b) return 0;
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function findClosestSuggestion(rawInput, curPrompt) {
      const clean = norm(rawInput);
      if (!clean || clean.length < 2) return null;

      const promptCandidates = curPrompt.answers.map(([a]) => norm(a));
      const pool = Array.from(new Set([...promptCandidates, ...KNOWN_LIST]));

      let bestWord = null;
      let bestDist = Infinity;

      for (const candidate of pool) {
        if (candidate === clean) continue;
        const dist = editDistance(clean, candidate);
        const maxAllowed = candidate.length <= 4 ? 1 : candidate.length <= 8 ? 2 : 3;
        if (dist <= maxAllowed && dist < bestDist) {
          bestDist = dist;
          bestWord = candidate;
        }
      }

      return bestWord;
    }

    function singularOrPluralVariants(word) {
      const set = new Set([word]);
      if (word.endsWith("ies") && word.length > 4) set.add(word.slice(0, -3) + "y");
      if (word.endsWith("es") && word.length > 3) set.add(word.slice(0, -2));
      if (word.endsWith("s") && word.length > 2) set.add(word.slice(0, -1));
      else set.add(word + "s");
      return Array.from(set);
    }

    const dictCache = new Map();

    async function checkDictionaryWordOrPhrase(phrase) {
      const clean = norm(phrase);
      if (!/^[a-z']+([ '-][a-z']+)*$/i.test(clean)) return false;

      const words = clean.split(/[\s-]+/).filter(Boolean);
      if (words.length === 0) return false;

      // Require every token to be a real English word
      for (const token of words) {
        const bare = token.replace(/'s$/i, "").replace(/'$/i, "");
        if (!bare) continue;
        if (bare.length === 1 && bare !== "a" && bare !== "i") return false;
        if (dictCache.has(bare)) {
          if (!dictCache.get(bare)) return false;
          continue;
        }
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2200);
          const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(bare)}`, {
            signal: controller.signal
          });
          clearTimeout(timer);
          dictCache.set(bare, res.ok);
          if (!res.ok) return false;
        } catch {
          // Reject obvious keyboard mash/gibberish if offline/timed out
          const looksLikeRealWord = /^[a-z]{2,18}$/i.test(bare) && /[aeiouy]/i.test(bare) && !/[^aeiouy]{5,}/i.test(bare);
          dictCache.set(bare, looksLikeRealWord);
          if (!looksLikeRealWord) return false;
        }
      }

      return true;
    }

    function matchesWordLengthConstraint(question, guess) {
      const isSingle = question.includes("single-word");
      const isMulti = question.includes("multi-word");
      const wordCount = norm(guess).split(" ").filter(Boolean).length;
      if (isSingle && wordCount !== 1) {
        return { ok: false, reason: `"${guess.trim()}" isn't a single word — try again (turn kept)!` };
      }
      if (isMulti && wordCount < 2) {
        return { ok: false, reason: `"${guess.trim()}" needs to be a multi-word answer — try again (turn kept)!` };
      }
      return { ok: true };
    }

    // Balanced marking:
    // 1) Exact / plural match in current prompt's answers -> accepted
    // 2) Partial / sub-phrase match with current prompt's answers -> accepted
    // 3) Valid English word that is NOT a known answer for another prompt AND relates to the prompt's topic/keywords -> accepted
    // 4) Unrelated dictionary words or answers from other topics -> rejected without losing turn, with suggestion if close
    async function evaluateBalancedAnswer(curPrompt, raw) {
      const cleaned = raw.trim();
      const n = norm(cleaned);
      if (!n) {
        return { ok: false, reason: "Type an answer first — your turn still counts!" };
      }

      const lenCheck = matchesWordLengthConstraint(curPrompt.question, cleaned);
      if (!lenCheck.ok) {
        return {
          ok: false,
          reason: lenCheck.reason,
          suggestion: findClosestSuggestion(cleaned, curPrompt)
        };
      }

      const guessVariants = singularOrPluralVariants(n);

      // 1. Direct or singular/plural match in current prompt
      for (const [ans, pop] of curPrompt.answers) {
        const target = norm(ans);
        const targetVariants = singularOrPluralVariants(target);
        if (guessVariants.some((v) => targetVariants.includes(v))) {
          return { ok: true, pop, note: "" };
        }
      }

      // 2. Partial / sub-phrase match against current prompt's answers
      for (const [ans, pop] of curPrompt.answers) {
        const target = norm(ans);
        const targetTokens = target.split(" ");
        const guessTokens = n.split(" ");
        const sharedToken = guessTokens.some((gt) =>
          singularOrPluralVariants(gt).some((gv) => targetTokens.includes(gv))
        );
        const substringMatch =
          (n.length >= 3 && target.includes(n)) ||
          (target.length >= 3 && n.includes(target));

        if (sharedToken || substringMatch) {
          return { ok: true, pop: Math.min(0.58, pop), note: " · Related match" };
        }
      }

      // 3. Reject if it belongs to another prompt's bank
      const otherBanks = ALL_BANK_ITEMS.get(n);
      if (otherBanks && !otherBanks.has(curPrompt.bankName)) {
        return {
          ok: false,
          reason: `"${cleaned}" fits a different prompt, not this one — try again (turn kept)!`,
          suggestion: findClosestSuggestion(cleaned, curPrompt)
        };
      }

      // 4. Check English dictionary + topic keyword relevance so random dictionary words are still filtered out
      const isEnglish = await checkDictionaryWordOrPhrase(cleaned);
      if (!isEnglish) {
        return {
          ok: false,
          reason: `"${cleaned}" isn't a valid English word or phrase — try again (turn kept)!`,
          suggestion: findClosestSuggestion(cleaned, curPrompt)
        };
      }

      const qLower = curPrompt.question.toLowerCase();
      const topicWords = new Set([
        ...(curPrompt.keywords || []),
        ...qLower.replace(/[^a-z\s]/g, " ").split(/\s+/).filter((w) => w.length >= 4)
      ]);

      const fitsTopic = guessVariants.some((gv) =>
        Array.from(topicWords).some((kw) => kw.startsWith(gv) || gv.startsWith(kw))
      );

      if (fitsTopic) {
        return { ok: true, pop: 0.42, note: " · Topic match" };
      }

      return {
        ok: false,
        reason: `"${cleaned}" doesn't clearly match this prompt — try again (turn kept)!`,
        suggestion: findClosestSuggestion(cleaned, curPrompt)
      };
    }

    function hashSeed(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }

        selected.push(pool.splice(s % pool.length, 1)[0]);
      }
      return selected;
    }

      const startTime = performance.now();
      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        displayedMeters = Math.round(start + diff * eased);
        depthValEl.textContent = `${displayedMeters.toLocaleString()}m`;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function descendOcean(meters, gainedPts) {
      const ratio = Math.min(1, meters / MAX_SCALE_DEPTH);
      const colShiftVh = -(ratio * 24900);
      document.documentElement.style.setProperty("--column-y", `${colShiftVh}vh`);

      const h = railBoxEl ? railBoxEl.clientHeight : 390;
      const topStart = 34;
      const topEnd = Math.max(topStart + 20, h - 56);
      krillDiverEl.style.top = `${topStart + ratio * (topEnd - topStart)}px`;

      animateDepthCounter(meters);
      depthValEl.classList.remove("bump");
      void depthValEl.offsetWidth;
      depthValEl.classList.add("bump");

      if (gainedPts > 0) {
        const dropPx = Math.min(220, 65 + Math.round((gainedPts / 100) * 155));
        document.documentElement.style.setProperty("--ui-drop", `${dropPx}px`);
        document.documentElement.style.setProperty("--ui-scale", "0.94");
        krillDiverEl.classList.add("sink-drop");
        rushLinesEl.classList.add("active");
        bubblesEl.classList.add("turbo");
        wrapEl.classList.remove("rumble");
        void wrapEl.offsetWidth;
        wrapEl.classList.add("rumble");

        setTimeout(() => {
          document.documentElement.style.setProperty("--ui-drop", "0px");
          document.documentElement.style.setProperty("--ui-scale", "1");
        }, 1150);

        setTimeout(() => {
          krillDiverEl.classList.remove("sink-drop");
          rushLinesEl.classList.remove("active");
          bubblesEl.classList.remove("turbo");
        }, 2000);
      }
    }

    function startGame(mode = "daily") {
      clearInterval(countdown);
      clearTimeout(nextRoundTimer);
      busy = false;

      const today = new Date().toISOString().slice(0, 10);
      const seed = mode === "daily" ? `daily-${today}` : `free-${Date.now()}-${Math.random()}`;
      sessionModeEl.textContent = mode === "daily" ? `Daily (${today})` : "Free Dive";

      deck = pickSeven(seed);
      round = 0;
      score = 0;
      displayedMeters = 0;
      log = [];
      msgEl.textContent = "";
      suggestionBoxEl.hidden = true;
      resultsAreaEl.hidden = true;
      playAreaEl.hidden = false;
      descendOcean(0, 0);
      runRound();
    }

    function runRound() {
      if (round >= TOTAL_ROUNDS || round >= deck.length) {
        showResults();
        return;
      }

      busy = false;
      const cur = deck[round];
      roundValEl.textContent = `${round + 1} / ${TOTAL_ROUNDS}`;
      catValEl.textContent = cur.category;
      questionValEl.textContent = cur.question;
      inputEl.value = "";
      inputEl.disabled = false;
      btnEl.disabled = false;
      suggestionBoxEl.hidden = true;
      msgEl.textContent = "";
      inputEl.focus();

      timeLeft = ROUND_TIME;
      timerValEl.textContent = `${timeLeft}s`;
      clearInterval(countdown);
      countdown = setInterval(() => {
        timeLeft -= 1;
        timerValEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          handleGuess("", true);
        }
      }, 1000);
    }

    async function handleGuess(raw, timedOut = false) {
      if (busy) return;
      busy = true;
      inputEl.disabled = true;
      btnEl.disabled = true;
      suggestionBoxEl.hidden = true;

      const cur = deck[round];
      const cleaned = raw.trim();

      if (timedOut) {
        clearInterval(countdown);
        msgEl.innerHTML = `<span class="bad">Time's up! +0 pts</span>`;
        log.push({ q: cur.question, ans: "—", pts: 0 });
        round += 1;
        nextRoundTimer = setTimeout(runRound, 1800);
        return;
      }

      msgEl.innerHTML = `<span class="warn">Checking answer...</span>`;
      const res = await evaluateBalancedAnswer(cur, cleaned);

      if (!res.ok) {
        busy = false;
        inputEl.disabled = false;
        btnEl.disabled = false;
        inputEl.focus();
        inputEl.select();
        msgEl.innerHTML = `<span class="bad">${res.reason}</span>`;
        showSuggestion(res.suggestion || null);
        return;
      }

      clearInterval(countdown);
      const pts = pointsFromRarity(res.pop);
      const tier = tierNameForPoints(pts);
      const cls = pts >= 32 ? "ok" : "warn";
      const dropMeters = pts * METERS_PER_POINT;

      msgEl.innerHTML = `<span class="${cls}"><strong>"${cleaned}"</strong>${res.note} — <strong>${tier}</strong> (+${pts} pts / -${dropMeters.toLocaleString()}m)</span>`;

      score += pts;
      descendOcean(score * METERS_PER_POINT, pts);
      log.push({ q: cur.question, ans: cleaned, pts });

      round += 1;
      nextRoundTimer = setTimeout(runRound, 2100);
    }

    function showResults() {
      clearInterval(countdown);
      clearTimeout(nextRoundTimer);
      playAreaEl.hidden = true;
      resultsAreaEl.hidden = false;

      const totalMeters = score * METERS_PER_POINT;
      const listHtml = log
        .map((entry) => `<li>${entry.q} — <strong>${entry.ans}</strong> (<em>+${entry.pts} pts / ${(entry.pts * METERS_PER_POINT).toLocaleString()}m</em>)</li>`)
        .join("");

      resultsAreaEl.innerHTML = `
        <h2>Dive Complete!</h2>
        <p>Score: <strong>${score} pts</strong> · Max Depth: <strong>${totalMeters.toLocaleString()}m</strong></p>
        <ul>${listHtml}</ul>
        <div class="actions">
          <button type="button" onclick="startGame('free')">Play Another 7 Rounds</button>
          <button type="button" class="ghost" onclick="startGame('daily')">Replay Daily</button>
        </div>
      `;
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      handleGuess(inputEl.value, false);
    });

    startGame("daily");
  </script>
</body>
</html>
