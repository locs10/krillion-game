<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krillion Dive — 1,000+ Prompts</title>
  <style>
    :root {
      --bg: #071b26;
      --card: rgba(14, 45, 63, 0.88);
      --card-2: rgba(9, 32, 46, 0.9);
      --text: #eef8ff;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --muted: #9ec5db;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      overflow-x: hidden;
      background: linear-gradient(180deg, #0e4a6e 0%, #072638 45%, #03111a 80%, #01060a 100%);
      transition: background-position 1.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.8s ease;
      background-size: 100% 260%;
      background-position: 0% 0%;
    }

    /* Rising ambient bubbles */
    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.45), rgba(56,189,248,0.12));
      border: 1px solid rgba(255,255,255,0.22);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) translateX(0) scale(0.9); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.55; }
      100% { transform: translateY(-110vh) translateX(18px) scale(1.1); opacity: 0; }
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      display: grid;
      grid-template-columns: 68px 1fr;
      gap: 0.85rem;
      align-items: stretch;
    }

    /* Vertical Ocean Depth Track */
    .depth-track {
      position: relative;
      background: linear-gradient(180deg, rgba(14,116,144,0.35) 0%, rgba(8,47,73,0.65) 55%, rgba(2,6,23,0.92) 100%);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 0.75rem 0.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 410px;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.45);
    }
    .zone-label {
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      opacity: 0.8;
    }
    .rail {
      position: absolute;
      top: 42px;
      bottom: 42px;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.14);
      border-radius: 999px;
    }
    .diver {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 1.45rem;
      line-height: 1;
      transition: top 1.15s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s ease;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
      z-index: 2;
    }
    .diver.sinking {
      transform: translate(-50%, 4px) scale(1.12);
    }

    .app {
      width: 100%;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .app.sink-pulse {
      animation: cardSink 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cardSink {
      0% { transform: translateY(0); }
      35% { transform: translateY(12px); }
      100% { transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .badge {
      background: var(--card-2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }
    .stat {
      background: var(--card-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.6rem 0.75rem;
      text-align: center;
    }
    .stat .label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .stat .val {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 0.15rem;
      display: inline-block;
      transition: transform 0.35s ease, color 0.35s ease;
    }
    .stat .val.pop {
      transform: scale(1.22);
      color: var(--accent-2);
    }
    .category-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-2);
      font-weight: 700;
    }
    .prompt {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0.4rem 0 1.15rem;
      line-height: 1.3;
    }
    form {
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      padding: 0.8rem 0.95rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: var(--card-2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      padding: 0.8rem 1.15rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #03131c;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .feedback {
      margin-top: 1rem;
      min-height: 2.6rem;
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .summary ul {
      padding-left: 1.2rem;
      line-height: 1.6;
    }
    .summary-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    @media (max-width: 560px) {
      .layout {
        grid-template-columns: 52px 1fr;
        gap: 0.6rem;
      }
      .app {
        padding: 1.1rem;
      }
      .prompt {
        font-size: 1.15rem;
      }
    }
  </style>
</head>

      <div class="summary" id="summary" hidden></div>

    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    function generatePromptBank() {
      const prompts = [];
      const seen = new Set();

      const addPrompt = (category, question, items) => {
        if (!items || items.length < 2) return;
        const key = `${category}|${question}`;
        if (seen.has(key)) return;
        seen.add(key);

        const answers = {};
        for (const [name, pop] of items) {
          const clean = name.trim().toLowerCase().replace(/\s+/g, " ");
          answers[clean] = pop;
        }
        prompts.push({ category, question, answers });
      };

      for (const [category, list] of Object.entries(BANKS)) {
        for (const letter of ALPHABET) {
          const matches = list.filter(([n]) => n.trim().toUpperCase().startsWith(letter));
          addPrompt(category, `Name a ${category.toLowerCase()} starting with "${letter}"`, matches);
        }
        for (const letter of ALPHABET) {
          const matches = list.filter(([n]) => {
            const wordOnly = n.trim().replace(/[^a-zA-Z]/g, "");
            return wordOnly.toUpperCase().endsWith(letter);
          });
          addPrompt(category, `Name a ${category.toLowerCase()} ending with "${letter}"`, matches);
        }
        for (let len = 3; len <= 12; len++) {
          const matches = list.filter(([n]) => n.replace(/[^a-zA-Z]/g, "").length === len);
          addPrompt(category, `Name a ${category.toLowerCase()} with ${len} letters`, matches);
        }
        for (const minLen of [6, 8, 10]) {
          const matches = list.filter(([n]) => n.replace(/[^a-zA-Z]/g, "").length >= minLen);
          addPrompt(category, `Name a ${category.toLowerCase()} with at least ${minLen} letters`, matches);
        }
        const doubleLetterItems = list.filter(([n]) => /([a-zA-Z])\1/i.test(n));
        addPrompt(category, `Name a ${category.toLowerCase()} containing double letters`, doubleLetterItems);

        const singleWordItems = list.filter(([n]) => n.trim().split(/\s+/).length === 1);
        addPrompt(category, `Name a single-word ${category.toLowerCase()}`, singleWordItems);

        const multiWordItems = list.filter(([n]) => n.trim().split(/\s+/).length >= 2);
        addPrompt(category, `Name a two-or-more-word ${category.toLowerCase()}`, multiWordItems);

        const rareItems = list.filter(([, pop]) => pop <= 0.35);
        addPrompt(category, `Name a lesser-known ${category.toLowerCase()}`, rareItems);

        const commonItems = list.filter(([, pop]) => pop >= 0.70);
        addPrompt(category, `Name a well-known ${category.toLowerCase()}`, commonItems);
      }

      const allItems = Object.entries(BANKS).flatMap(([cat, arr]) =>
        arr.map(([name, pop]) => [name, pop, cat])
      );

      for (const letter of ALPHABET) {
        const matches = allItems
          .filter(([n]) => n.trim().toUpperCase().startsWith(letter))
          .map(([n, pop]) => [n, pop]);
        addPrompt("Any Category", `Name anything starting with "${letter}"`, matches);
      }

      for (let len = 4; len <= 11; len++) {
        const matches = allItems
          .filter(([n]) => n.replace(/[^a-zA-Z]/g, "").length === len)
          .map(([n, pop]) => [n, pop]);
        addPrompt("Any Category", `Name anything with ${len} letters`, matches);
      }

      for (const letter of ALPHABET) {
        for (const minLen of [4, 5, 6, 7]) {
          const matches = allItems
            .filter(([n]) =>
              n.trim().toUpperCase().startsWith(letter) &&
              n.replace(/[^a-zA-Z]/g, "").length >= minLen
            )
            .map(([n, pop]) => [n, pop]);
          addPrompt("Word Challenge", `Starts with "${letter}" and has ${minLen}+ letters`, matches);
        }
      }

      return prompts;
    }

    const ALL_PROMPTS = generatePromptBank();
    document.getElementById("bank-count").textContent = `Prompts: ${ALL_PROMPTS.length.toLocaleString()}`;

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function pickSeededSeven(seedStr) {
      let seed = hashString(seedStr) || 1;
      const pool = [...ALL_PROMPTS];
      const chosen = [];
      while (chosen.length < 7 && pool.length > 0) {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        const idx = seed % pool.length;
        chosen.push(pool.splice(idx, 1)[0]);
      }
      return chosen;
    }

    const ROUND_SECONDS = 25;
    const MAX_EXPECTED_DEPTH = 4500; // Scales visual sink depth smoothly
    let activePrompts = [];
    let roundIndex = 0;
    let totalPoints = 0;
    let timeLeft = ROUND_SECONDS;
    let timerId = null;
    let history = [];

    const modeBadge = document.getElementById("mode-badge");
    const roundInfo = document.getElementById("round-info");
    const timerInfo = document.getElementById("timer-info");
    const depthInfo = document.getElementById("depth-info");
    const categoryInfo = document.getElementById("category-info");
    const promptText = document.getElementById("prompt-text");
    const form = document.getElementById("answer-form");
    const input = document.getElementById("answer-input");
    const feedback = document.getElementById("feedback");
    const summary = document.getElementById("summary");
    const gameView = document.getElementById("game-view");
    const diver = document.getElementById("diver");
    const appCard = document.getElementById("app-card");
    const trackEl = document.querySelector(".depth-track");

    const normalize = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");

    function findMatch(answers, raw) {
      const norm = normalize(raw);
      if (!norm) return null;
      if (Object.prototype.hasOwnProperty.call(answers, norm)) {
        return { matched: norm, pop: answers[norm] };
      }
      const alt = norm.endsWith("s") ? norm.slice(0, -1) : `${norm}s`;
      if (Object.prototype.hasOwnProperty.call(answers, alt)) {
        return { matched: alt, pop: Math.min(0.95, answers[alt] + 0.05) };
      }
      return null;
    }

    function updateSinkAnimation(depthMeters, didSink) {
      const ratio = Math.min(1, depthMeters / MAX_EXPECTED_DEPTH);

      // Darken ocean backdrop as depth increases
      const bgPos = Math.round(ratio * 100);
      document.body.style.backgroundPosition = `0% ${bgPos}%`;

      // Move diver down the vertical track
      const trackHeight = trackEl ? trackEl.clientHeight : 410;
      const topMin = 34;
      const topMax = Math.max(topMin + 20, trackHeight - 58);
      const diverTop = topMin + ratio * (topMax - topMin);
      diver.style.top = `${diverTop}px`;

      // Pop depth counter & trigger sink pulse on card/diver
      depthInfo.textContent = `${depthMeters.toLocaleString()}m`;
      depthInfo.classList.remove("pop");
      void depthInfo.offsetWidth;
      depthInfo.classList.add("pop");

      if (didSink) {
        diver.classList.add("sinking");
        appCard.classList.remove("sink-pulse");
        void appCard.offsetWidth;
        appCard.classList.add("sink-pulse");
        setTimeout(() => diver.classList.remove("sinking"), 1150);
      }
    }

    function startSession(mode = "daily") {
      clearInterval(timerId);
      const todayUtc = new Date().toISOString().slice(0, 10);
      const seed = mode === "daily" ? `daily-${todayUtc}` : `rand-${Date.now()}-${Math.random()}`;
      modeBadge.textContent = mode === "daily" ? `Daily Dive (${todayUtc})` : "Random Dive";

      activePrompts = pickSeededSeven(seed);
      roundIndex = 0;
      totalPoints = 0;
      history = [];
      feedback.textContent = "";
      summary.hidden = true;
      gameView.hidden = false;
      updateSinkAnimation(0, false);
      startRound();
    }

    function startRound() {
      if (roundIndex >= activePrompts.length) {
        endDive();
        return;
      }
      const cur = activePrompts[roundIndex];
      roundInfo.textContent = `${roundIndex + 1} / ${activePrompts.length}`;
      categoryInfo.textContent = cur.category;
      promptText.textContent = cur.question;
      input.value = "";
      input.disabled = false;
      input.focus();

      timeLeft = ROUND_SECONDS;
      timerInfo.textContent = `${timeLeft}s`;
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft -= 1;
        timerInfo.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerId);
          submitAnswer("", true);
        }
      }, 1000);
    }

    function submitAnswer(rawAnswer, timedOut = false) {
      clearInterval(timerId);
      input.disabled = true;

      const cur = activePrompts[roundIndex];
      const cleaned = rawAnswer.trim();
      let pts = 0;

      if (timedOut) {
        feedback.innerHTML = `<span class="bad">Time's up! +0 pts</span>`;
      } else {
        const hit = findMatch(cur.answers, cleaned);
        if (hit) {
          pts = Math.max(5, Math.round((1 - hit.pop) * 100));
          const tier = pts >= 80 ? "One in a Krillion!" : pts >= 55 ? "Deep Cut" : pts >= 30 ? "Rare" : "Common";
          const cls = pts >= 55 ? "ok" : "warn";
          feedback.innerHTML = `<span class="${cls}"><strong>"${cleaned}"</strong> → ${tier} (+${pts} pts, sinking +${pts * 10}m...)</span>`;
        } else {
          feedback.innerHTML = `<span class="bad">"${cleaned}" isn't in this prompt's list (+0 pts)</span>`;
        }
      }

      totalPoints += pts;
      updateSinkAnimation(totalPoints * 10, pts > 0);
      history.push({ q: cur.question, ans: cleaned || "—", pts });

      roundIndex += 1;
      setTimeout(startRound, 1450);
    }

    function endDive() {
      gameView.hidden = true;
      summary.hidden = false;
      const depth = totalPoints * 10;
      const rows = history
        .map((h) => `<li>${h.q} — <strong>${h.ans}</strong> (<em>+${h.pts} pts</em>)</li>`)
        .join("");

      summary.innerHTML = `
        <h2>Dive Complete!</h2>
        <p>Score: <strong>${totalPoints} pts</strong> · Max Depth: <strong>${depth.toLocaleString()}m</strong></p>
        <ul>${rows}</ul>
        <div class="summary-actions">
          <button onclick="startSession('random')">Play Another 7 (Random)</button>
          <button class="secondary" onclick="startSession('daily')">Replay Today's Daily</button>
        </div>
      `;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      submitAnswer(input.value, false);
    });

    startSession("daily");
  </script>
</body>
</html>
