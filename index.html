<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krillion — Ocean Dive</title>
  <style>
    :root {
      --card: rgba(7, 27, 40, 0.84);
      --card-2: rgba(4, 16, 26, 0.9);
      --text: #f0f9ff;
      --muted: #9bc4dc;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --column-y: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #041724;
    }

    /* Continuous full-viewport ocean column that scrolls downward as you sink */
    .ocean-world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: linear-gradient(
        180deg,
        #1679ab 0%,
        #0d4d70 18%,
        #072c42 42%,
        #041826 68%,
        #020b14 88%,
        #010408 100%
      );
    }

    .ocean-column {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 360vh;
      transform: translateY(var(--column-y));
      transition: transform 1.45s cubic-bezier(0.16, 0.88, 0.28, 1);
      pointer-events: none;
    }

    /* Animated water surface & light rays near top of column */
    .surface-band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.34), rgba(14, 116, 144, 0));
    }

    .wave-line {
      position: absolute;
      top: 78px;
      left: -25%;
      width: 150%;
      height: 34px;
      border-top: 2px solid rgba(224, 242, 254, 0.65);
      border-radius: 45%;
      background: rgba(186, 230, 253, 0.14);
      animation: waveDrift 7s ease-in-out infinite;
    }

    .wave-line.second {
      top: 90px;
      border-top-color: rgba(56, 189, 248, 0.35);
      background: rgba(34, 211, 238, 0.08);
      animation: waveDrift 10s ease-in-out infinite reverse;
    }

    @keyframes waveDrift {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(3.5%) translateY(5px); }
    }

    /* Depth markers spaced down the ocean column */
    .depth-marker {
      position: absolute;
      left: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(186, 230, 253, 0.38);
    }

    .depth-marker::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(186, 230, 253, 0.22), rgba(186, 230, 253, 0.03));
    }

    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bubble {
      position: absolute;
      bottom: -24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(56,189,248,0.12));
      border: 1px solid rgba(255,255,255,0.22);
      animation: riseBubble linear infinite;
    }

    @keyframes riseBubble {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.65; }
      85% { opacity: 0.4; }
      100% { transform: translateY(-112vh) translateX(14px); opacity: 0; }
    }

    /* Foreground UI container */
    .ui-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 0.85rem;
      align-items: stretch;
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .wrap.plunging {
      transform: translateY(18px);
    }

    .depth-rail-box {
      position: relative;
      min-height: 390px;
      border-radius: 18px;
      padding: 0.75rem 0.25rem;
      background: rgba(4, 18, 28, 0.72);
      border: 1px solid rgba(255,255,255,0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .rail-tag {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .rail-track {
      position: absolute;
      top: 42px;
      bottom: 42px;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.16);
      border-radius: 999px;
    }

    .krill-diver {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 1.35rem;
      line-height: 1;
      z-index: 2;
      transition: top 1.35s cubic-bezier(0.16, 0.88, 0.28, 1), transform 0.6s ease;
    }

    .krill-diver.sink-drop {
      transform: translate(-50%, 8px) scale(1.15);
    }

    .panel {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .pill {
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.15rem;
    }

    .stat {
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 0.6rem;
      text-align: center;
    }

    .stat small {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .stat strong {
      font-size: 1.05rem;
      display: inline-block;
      margin-top: 0.15rem;
      transition: transform 0.35s ease, color 0.35s ease;
    }

    .stat strong.bump {
      transform: scale(1.22);
      color: var(--accent-2);
    }

    .cat {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-2);
    }

    .question {
      font-size: 1.32rem;
      font-weight: 700;
      margin: 0.35rem 0 1.1rem;
      line-height: 1.3;
    }

    form {
      display: flex;
      gap: 0.5rem;
    }

    input {
      flex: 1;
      padding: 0.78rem 0.95rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: var(--card-2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 0.78rem 1.15rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #03131c;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.ghost {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .msg {
      margin-top: 0.95rem;
      min-height: 2.6rem;
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }

    .results ul {
      padding-left: 1.2rem;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="ocean-world" aria-hidden="true">
    <div class="ocean-column" id="ocean-column">
      <div class="surface-band">
        <div class="wave-line"></div>
        <div class="wave-line second"></div>
      </div>
      <div class="depth-marker" style="top: 14%;">200m · Sunlight Zone</div>
      <div class="depth-marker" style="top: 32%;">1,000m · Midnight Zone</div>
      <div class="depth-marker" style="top: 52%;">2,500m · Deep Descent</div>
      <div class="depth-marker" style="top: 70%;">3,800m · Titanic Depth</div>
      <div class="depth-marker" style="top: 85%;">5,000m · Abyssal Zone</div>
      <div class="depth-marker" style="top: 96%;">7,000m · Trench Floor</div>
    </div>
  </div>

  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <div class="ui-shell">
    <div class="wrap" id="wrap">
      <aside class="depth-rail-box" aria-label="Depth meter">
        <span class="rail-tag">0m</span>
        <div class="rail-track"></div>
        <div class="krill-diver" id="krill-diver">🦐</div>
        <span class="rail-tag">7000m</span>
      </aside>

      <main class="panel">
        <div class="top">
          <span class="pill" id="prompt-count">Prompts: 0</span>
          <span class="pill" id="session-mode">Daily Dive</span>
        </div>

        <div class="stats">
          <div class="stat"><small>Round</small><strong id="round-val">1 / 7</strong></div>
          <div class="stat"><small>Timer</small><strong id="timer-val">25s</strong></div>
          <div class="stat"><small>Depth</small><strong id="depth-val">0m</strong></div>
        </div>

        <div id="play-area">
          <div class="cat" id="cat-val">Category</div>
          <div class="question" id="question-val">Loading...</div>
          <form id="guess-form">
            <input id="guess-input" type="text" autocomplete="off" placeholder="Type an English word or phrase..." required />
            <button type="submit" id="guess-btn">Dive</button>
          </form>
          <div class="msg" id="msg-val"></div>
        </div>

        <div class="results" id="results-area" hidden></div>
      </main>
    </div>
  </div>

    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const CATEGORY_LOOKUP = new Map();

    for (const [cat, list] of Object.entries(ITEMS)) {
      for (const [name, pop] of list) {
        const clean = name.trim().toLowerCase().replace(/\s+/g, " ");
        CATEGORY_LOOKUP.set(clean, { category: cat, pop });
        const plural = clean.endsWith("s") ? clean : `${clean}s`;
        if (!CATEGORY_LOOKUP.has(plural)) {
          CATEGORY_LOOKUP.set(plural, { category: cat, pop: Math.min(0.95, pop + 0.04) });
        }
      }
    }

    function buildPrompts() {
      const out = [];
      const seen = new Set();

      const add = (category, question, list, rule) => {
        if (!list || list.length < 2) return;
        const key = `${category}|${question}`;
        if (seen.has(key)) return;
        seen.add(key);

        const answers = {};
        for (const [name, pop] of list) {
          answers[name.trim().toLowerCase().replace(/\s+/g, " ")] = pop;
        }
        out.push({ category, question, answers, rule });
      };

      for (const [cat, list] of Object.entries(ITEMS)) {
        for (const ch of LETTERS) {
          add(cat, `Name a ${cat.toLowerCase()} starting with "${ch}"`,
            list.filter(([n]) => n.trim().toUpperCase().startsWith(ch)),
            { type: "starts", ch });
          add(cat, `Name a ${cat.toLowerCase()} ending with "${ch}"`,
            list.filter(([n]) => n.trim().replace(/[^a-zA-Z]/g, "").toUpperCase().endsWith(ch)),
            { type: "ends", ch });
        }
        for (let len = 3; len <= 12; len++) {
          add(cat, `Name a ${cat.toLowerCase()} with ${len} letters`,
            list.filter(([n]) => n.replace(/[^a-zA-Z]/g, "").length === len),
            { type: "len", len });
        }
        for (const minLen of [6, 8, 10]) {
          add(cat, `Name a ${cat.toLowerCase()} with at least ${minLen} letters`,
            list.filter(([n]) => n.replace(/[^a-zA-Z]/g, "").length >= minLen),
            { type: "minLen", minLen });
        }
        add(cat, `Name a ${cat.toLowerCase()} with double letters`,
          list.filter(([n]) => /([a-zA-Z])\1/i.test(n)),
          { type: "double" });
        add(cat, `Name a deep-cut ${cat.toLowerCase()}`,
          list.filter(([, p]) => p <= 0.30),
          { type: "any" });
        add(cat, `Name an obscure ${cat.toLowerCase()}`,
          list.filter(([, p]) => p <= 0.18),
          { type: "any" });
        add(cat, `Name a single-word ${cat.toLowerCase()}`,
          list.filter(([n]) => n.trim().split(/\s+/).length === 1),
          { type: "oneWord" });
        add(cat, `Name a multi-word ${cat.toLowerCase()}`,
          list.filter(([n]) => n.trim().split(/\s+/).length >= 2),
          { type: "multiWord" });
      }

      const allEntries = Object.entries(ITEMS).flatMap(([cat, arr]) => arr.map(([n, p]) => [n, p, cat]));

      for (const ch of LETTERS) {
        add("Niche Word", `Any English word or phrase starting with "${ch}"`,
          allEntries.filter(([n]) => n.trim().toUpperCase().startsWith(ch)).map(([n, p]) => [n, p]),
          { type: "starts", ch });
        add("Niche Word", `Any English word or phrase ending with "${ch}"`,
          allEntries.filter(([n]) => n.trim().replace(/[^a-zA-Z]/g, "").toUpperCase().endsWith(ch)).map(([n, p]) => [n, p]),
          { type: "ends", ch });
      }

      for (let len = 4; len <= 12; len++) {
        add("Niche Word", `Any English word or phrase with ${len} letters`,
          allEntries.filter(([n]) => n.replace(/[^a-zA-Z]/g, "").length === len).map(([n, p]) => [n, p]),
          { type: "len", len });
      }

      add("Niche Word", `Any English word or phrase with double letters`,
        allEntries.filter(([n]) => /([a-zA-Z])\1/i.test(n)).map(([n, p]) => [n, p]),
        { type: "double" });

      add("Niche Word", `Any multi-word English phrase`,
        allEntries.filter(([n]) => n.trim().split(/\s+/).length >= 2).map(([n, p]) => [n, p]),
        { type: "multiWord" });

      for (const ch of LETTERS) {
        for (const minLen of [5, 7, 9]) {
          add("Deep Constraint", `Starts with "${ch}" and has ${minLen}+ letters`,
            allEntries
              .filter(([n]) => n.trim().toUpperCase().startsWith(ch) && n.replace(/[^a-zA-Z]/g, "").length >= minLen)
              .map(([n, p]) => [n, p]),
            { type: "startsMin", ch, minLen });
        }
      }

      return out;
    }

    const ALL_PROMPTS = buildPrompts();
    document.getElementById("prompt-count").textContent = `Prompts: ${ALL_PROMPTS.length.toLocaleString()}`;

    (function spawnBubbles() {
      const box = document.getElementById("bubbles");
      for (let i = 0; i < 22; i++) {
        const el = document.createElement("span");
        el.className = "bubble";
        const size = 6 + Math.random() * 14;
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${Math.random() * 100}%`;
        el.style.animationDuration = `${6 + Math.random() * 8}s`;
        el.style.animationDelay = `${-Math.random() * 10}s`;
        box.appendChild(el);
      }
    })();

    const dictCache = new Map();

    async function checkDictionaryPhrase(phrase) {
      const clean = phrase.trim().toLowerCase().replace(/\s+/g, " ");
      if (!/^[a-z]+([ '-][a-z]+)*$/i.test(clean)) return false;

      const words = clean.split(/[\s-]+/).filter(Boolean);
      if (words.length === 0) return false;

      const targets = words.length > 1 ? [clean, ...words] : [words[0]];

      for (const token of targets) {
        if (dictCache.has(token)) {
          if (dictCache.get(token)) return true;
          continue;
        }
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2400);
          const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(token)}`, {
            signal: controller.signal
          });
          clearTimeout(timer);
          dictCache.set(token, res.ok);
          if (res.ok) return true;
        } catch {
          if (/^[a-z]{2,}$/i.test(token)) {
            dictCache.set(token, true);
            return true;
          }
          dictCache.set(token, false);
        }
      }

      return false;
    }

    function passesRule(text, rule) {
      if (!rule || rule.type === "any") return true;
      const trimmed = text.trim();
      const letters = trimmed.replace(/[^a-zA-Z]/g, "");
      const upper = trimmed.toUpperCase();
      const upperLetters = letters.toUpperCase();

      if (rule.type === "starts") return upper.startsWith(rule.ch);
      if (rule.type === "ends") return upperLetters.endsWith(rule.ch);
      if (rule.type === "len") return letters.length === rule.len;
      if (rule.type === "minLen") return letters.length >= rule.minLen;
      if (rule.type === "double") return /([a-zA-Z])\1/i.test(letters);
      if (rule.type === "oneWord") return trimmed.split(/\s+/).length === 1;
      if (rule.type === "multiWord") return trimmed.split(/\s+/).length >= 2;
      if (rule.type === "startsMin") return upper.startsWith(rule.ch) && letters.length >= rule.minLen;
      return true;
    }

    function pointsFromRarity(pop) {
      // Maps rarity (1 - pop) to Krillion-style tiers: Plankton -> One in a Krillion (up to 100 pts = 1000m)
      const rarity = Math.max(0.05, Math.min(1, 1 - pop));
      if (rarity >= 0.85) return 100; // One in a Krillion (1,000m)
      if (rarity >= 0.68) return 64;  // Deep Cut (640m)
      if (rarity >= 0.48) return 32;  // Rare (320m)
      if (rarity >= 0.28) return 16;  // Schooler (160m)
      if (rarity >= 0.14) return 8;   // Too Clever (80m)
      return 4;                        // Plankton (40m)
    }

    function tierNameForPoints(pts) {
      if (pts >= 100) return "One in a Krillion";
      if (pts >= 64) return "Deep Cut";
      if (pts >= 32) return "Rare";
      if (pts >= 16) return "Schooler";
      if (pts >= 8) return "Too Clever";
      return "Plankton";
    }

    function rarityFromPhrase(text) {
      const letters = text.trim().replace(/[^a-zA-Z]/g, "").toLowerCase();
      const uncommon = new Set(["q", "x", "z", "j", "k", "v", "w", "y"]);
      let rareChars = 0;
      for (const c of letters) if (uncommon.has(c)) rareChars++;
      const isPhrase = text.trim().split(/\s+/).length >= 2 ? 0.12 : 0;
      const lenBoost = Math.min(0.45, Math.max(0, (letters.length - 4) * 0.05));
      const charBoost = Math.min(0.35, rareChars * 0.15);
      return Math.max(0.08, Math.min(0.85, 0.76 - lenBoost - charBoost - isPhrase));
    }

    function hashSeed(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function pickSeven(seedStr) {
      let s = hashSeed(seedStr) || 1;
      const pool = [...ALL_PROMPTS];
      const selected = [];
      while (selected.length < 7 && pool.length > 0) {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        selected.push(pool.splice(s % pool.length, 1)[0]);
      }
      return selected;
    }

    const TOTAL_ROUNDS = 7;
    const ROUND_TIME = 25;
    const MAX_SCALE_DEPTH = 7000;

    let deck = [];
    let round = 0;
    let score = 0;
    let timeLeft = ROUND_TIME;
    let countdown = null;
    let nextRoundTimer = null;
    let log = [];
    let busy = false;

    const oceanColumnEl = document.getElementById("ocean-column");
    const wrapEl = document.getElementById("wrap");
    const sessionModeEl = document.getElementById("session-mode");
    const roundValEl = document.getElementById("round-val");
    const timerValEl = document.getElementById("timer-val");
    const depthValEl = document.getElementById("depth-val");
    const catValEl = document.getElementById("cat-val");
    const questionValEl = document.getElementById("question-val");
    const formEl = document.getElementById("guess-form");
    const inputEl = document.getElementById("guess-input");
    const btnEl = document.getElementById("guess-btn");
    const msgEl = document.getElementById("msg-val");
    const playAreaEl = document.getElementById("play-area");
    const resultsAreaEl = document.getElementById("results-area");
    const krillDiverEl = document.getElementById("krill-diver");
    const railBoxEl = document.querySelector(".depth-rail-box");

    function norm(s) {
      return s.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function matchList(answers, raw) {
      const n = norm(raw);
      if (!n) return null;
      if (Object.prototype.hasOwnProperty.call(answers, n)) {
        return { pop: answers[n] };
      }
      const alt = n.endsWith("s") ? n.slice(0, -1) : `${n}s`;
      if (Object.prototype.hasOwnProperty.call(answers, alt)) {
        return { pop: Math.min(0.95, answers[alt] + 0.05) };
      }
      return null;
    }

    function descendOcean(meters, gainedPts) {
      const ratio = Math.min(1, meters / MAX_SCALE_DEPTH);
      // Ocean column is 360vh tall; shifting upward by up to ~260vh moves camera downward through depth zones
      const colShiftVh = -(ratio * 260);
      document.documentElement.style.setProperty("--column-y", `${colShiftVh}vh`);

      // Diver slides down vertical meter
      const h = railBoxEl ? railBoxEl.clientHeight : 390;
      const topStart = 34;
      const topEnd = Math.max(topStart + 20, h - 56);
      krillDiverEl.style.top = `${topStart + ratio * (topEnd - topStart)}px`;

      depthValEl.textContent = `${meters.toLocaleString()}m`;
      depthValEl.classList.remove("bump");
      void depthValEl.offsetWidth;
      depthValEl.classList.add("bump");

      if (gainedPts > 0) {
        krillDiverEl.classList.add("sink-drop");
        wrapEl.classList.add("plunging");
        setTimeout(() => {
          krillDiverEl.classList.remove("sink-drop");
          wrapEl.classList.remove("plunging");
        }, 1150);
      }
    }

    function startGame(mode = "daily") {
      clearInterval(countdown);
      clearTimeout(nextRoundTimer);
      busy = false;

      const today = new Date().toISOString().slice(0, 10);
      const seed = mode === "daily" ? `daily-${today}` : `free-${Date.now()}-${Math.random()}`;
      sessionModeEl.textContent = mode === "daily" ? `Daily (${today})` : "Free Dive";

      deck = pickSeven(seed);
      round = 0;
      score = 0;
      log = [];
      msgEl.textContent = "";
      resultsAreaEl.hidden = true;
      playAreaEl.hidden = false;
      descendOcean(0, 0);
      runRound();
    }

    function runRound() {
      if (round >= TOTAL_ROUNDS || round >= deck.length) {
        showResults();
        return;
      }

      busy = false;
      const cur = deck[round];
      roundValEl.textContent = `${round + 1} / ${TOTAL_ROUNDS}`;
      catValEl.textContent = cur.category;
      questionValEl.textContent = cur.question;
      inputEl.value = "";
      inputEl.disabled = false;
      btnEl.disabled = false;
      inputEl.focus();

      timeLeft = ROUND_TIME;
      timerValEl.textContent = `${timeLeft}s`;
      clearInterval(countdown);
      countdown = setInterval(() => {
        timeLeft -= 1;
        timerValEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          handleGuess("", true);
        }
      }, 1000);
    }

    async function scoreGuess(cur, raw) {
      const cleaned = raw.trim();
      const n = norm(cleaned);
      if (!n) return { ok: false, reason: "Type an answer first." };

      const listed = matchList(cur.answers, cleaned);
      if (listed) {
        return { ok: true, pop: listed.pop, extra: "" };
      }

      const inDict = await checkDictionaryPhrase(cleaned);
      if (!inDict) {
        return { ok: false, reason: `"${cleaned}" isn't in the English dictionary` };
      }

      const isOpenPrompt = cur.category === "Niche Word";
      const knownItem = CATEGORY_LOOKUP.get(n);
      if (!isOpenPrompt && knownItem && knownItem.category !== cur.category) {
        return { ok: false, reason: `"${cleaned}" belongs to ${knownItem.category}, not ${cur.category}` };
      }

      if (!passesRule(cleaned, cur.rule)) {
        return { ok: false, reason: `"${cleaned}" doesn't match the prompt's rule` };
      }

      return {
        ok: true,
        pop: rarityFromPhrase(cleaned),
        extra: isOpenPrompt ? " · Dictionary" : " · Technical match"
      };
    }

    async function handleGuess(raw, timedOut = false) {
      if (busy) return;
      busy = true;
      clearInterval(countdown);
      inputEl.disabled = true;
      btnEl.disabled = true;

      const cur = deck[round];
      const cleaned = raw.trim();
      let pts = 0;

      if (timedOut) {
        msgEl.innerHTML = `<span class="bad">Time's up! +0 pts</span>`;
      } else {
        msgEl.innerHTML = `<span class="warn">Checking depth...</span>`;
        const res = await scoreGuess(cur, cleaned);
        if (res.ok) {
          pts = pointsFromRarity(res.pop);
          const tier = tierNameForPoints(pts);
          const cls = pts >= 32 ? "ok" : "warn";
          msgEl.innerHTML = `<span class="${cls}"><strong>"${cleaned}"</strong>${res.extra} — <strong>${tier}</strong> (+${pts} pts / -${pts * 10}m)</span>`;
        } else {
          msgEl.innerHTML = `<span class="bad">${res.reason} (+0 pts)</span>`;
        }
      }

      score += pts;
      descendOcean(score * 10, pts);
      log.push({ q: cur.question, ans: cleaned || "—", pts });

      round += 1;
      nextRoundTimer = setTimeout(runRound, 1650);
    }

    function showResults() {
      clearInterval(countdown);
      clearTimeout(nextRoundTimer);
      playAreaEl.hidden = true;
      resultsAreaEl.hidden = false;

      const totalMeters = score * 10;
      const listHtml = log
        .map((entry) => `<li>${entry.q} — <strong>${entry.ans}</strong> (<em>+${entry.pts} pts / ${entry.pts * 10}m</em>)</li>`)
        .join("");

      resultsAreaEl.innerHTML = `
        <h2>Dive Complete!</h2>
        <p>Score: <strong>${score} pts</strong> · Max Depth: <strong>${totalMeters.toLocaleString()}m</strong></p>
        <ul>${listHtml}</ul>
        <div class="actions">
          <button type="button" onclick="startGame('free')">Play Another 7 Rounds</button>
          <button type="button" class="ghost" onclick="startGame('daily')">Replay Daily</button>
        </div>
      `;
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      handleGuess(inputEl.value, false);
    });

    startGame("daily");
  </script>
</body>
</html>
