<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krillion — Real-Life Abyssal Dive</title>
  <style>
    :root {
      --card: rgba(6, 24, 36, 0.88);
      --card-2: rgba(3, 14, 22, 0.94);
      --text: #f0f9ff;
      --muted: #9bc4dc;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --column-y: 0vh;
      --ui-drop: 0px;
      --ui-scale: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #010408;
    }

    .ocean-world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #000205;
    }

    .ocean-column {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 25000vh;
      background: linear-gradient(
        180deg,
        #22a2e0 0%,
        #1679ab 1.5%,
        #0d4d70 4%,
        #072c42 9%,
        #041a2b 18%,
        #020e1a 35%,
        #01070e 60%,
        #000308 85%,
        #000103 100%
      );
      transform: translateY(var(--column-y));
      transition: transform 2.2s cubic-bezier(0.12, 0.92, 0.22, 1);
      pointer-events: none;
      will-change: transform;
    }

    .surface-band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 260px;
      background: linear-gradient(180deg, rgba(186, 230, 253, 0.5), rgba(14, 116, 144, 0));
    }

    .wave-line {
      position: absolute;
      top: 120px;
      left: -25%;
      width: 150%;
      height: 44px;
      border-top: 3px solid rgba(224, 242, 254, 0.85);
      border-radius: 45%;
      background: rgba(186, 230, 253, 0.18);
      animation: waveDrift 6s ease-in-out infinite;
    }

    .wave-line.second {
      top: 136px;
      border-top-color: rgba(56, 189, 248, 0.45);
      background: rgba(34, 211, 238, 0.1);
      animation: waveDrift 9s ease-in-out infinite reverse;
    }

    @keyframes waveDrift {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(3.5%) translateY(6px); }
    }

    .depth-marker {
      position: absolute;
      left: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(186, 230, 253, 0.48);
    }

    .depth-marker::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(125, 211, 252, 0.35), rgba(125, 211, 252, 0.04));
    }

    .depth-marker.major {
      font-size: 0.95rem;
      color: rgba(34, 211, 238, 0.78);
    }

    .depth-marker.major::after {
      height: 2px;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.65), rgba(34, 211, 238, 0.05));
    }

    .rush-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .rush-lines.active { opacity: 1; }

    .streak {
      position: absolute;
      bottom: -180px;
      width: 3px;
      height: 180px;
      background: linear-gradient(0deg, rgba(186, 230, 253, 0), rgba(125, 211, 252, 0.75), rgba(255, 255, 255, 0.95));
      animation: shootUp 0.42s linear infinite;
    }

    @keyframes shootUp {
      0% { transform: translateY(180px); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }

    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bubble {
      position: absolute;
      bottom: -24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(56,189,248,0.14));
      border: 1px solid rgba(255,255,255,0.24);
      animation: riseBubble linear infinite;
    }

    .bubbles.turbo .bubble { animation-duration: 0.75s !important; }

    @keyframes riseBubble {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-115vh) translateX(14px); opacity: 0; }
    }

    .ui-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 0.85rem;
      align-items: stretch;
      transform: translateY(var(--ui-drop)) scale(var(--ui-scale));
      transition: transform 1.45s cubic-bezier(0.16, 0.92, 0.24, 1);
      will-change: transform;
    }

    .wrap.rumble { animation: abyssRumble 0.55s ease-in-out; }

    @keyframes abyssRumble {
      0%, 100% { margin-left: 0px; }
      20% { margin-left: -7px; }
      40% { margin-left: 7px; }
      60% { margin-left: -4px; }
      80% { margin-left: 4px; }
    }

    .depth-rail-box {
      position: relative;
      min-height: 390px;
      border-radius: 18px;
      padding: 0.75rem 0.25rem;
      background: rgba(4, 18, 28, 0.78);
      border: 1px solid rgba(255,255,255,0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .rail-tag {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .rail-track {
      position: absolute;
      top: 42px;
      bottom: 42px;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
    }

    .krill-diver {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 1.45rem;
      line-height: 1;
      z-index: 2;
      transition: top 2.1s cubic-bezier(0.12, 0.92, 0.22, 1), transform 0.6s ease;
    }

    .krill-diver.sink-drop {
      transform: translate(-50%, 18px) scale(1.32) rotate(12deg);
    }

    .panel {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.72);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .pill {
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.15rem;
    }

    .stat {
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 0.6rem;
      text-align: center;
    }

    .stat small {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .stat strong {
      font-size: 1.05rem;
      display: inline-block;
      margin-top: 0.15rem;
      transition: transform 0.35s ease, color 0.35s ease;
    }

    .stat strong.bump {
      transform: scale(1.3);
      color: var(--accent-2);
    }

    .cat {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-2);
    }

    .question {
      font-size: 1.32rem;
      font-weight: 700;
      margin: 0.35rem 0 1.1rem;
      line-height: 1.3;
    }

    form {
      display: flex;
      gap: 0.5rem;
    }

    input {
      flex: 1;
      padding: 0.78rem 0.95rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: var(--card-2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 0.78rem 1.15rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #03131c;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.ghost {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .suggestion-box {
      margin-top: 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--warn);
    }

    .suggestion-btn {
      padding: 0.32rem 0.72rem;
      font-size: 0.85rem;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.16);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.45);
    }

    .suggestion-btn:hover {
      background: rgba(251, 191, 36, 0.28);
    }

    .msg {
      margin-top: 0.85rem;
      min-height: 2.4rem;
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }

    .results ul {
      padding-left: 1.2rem;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="ocean-world" aria-hidden="true">
    <div class="ocean-column" id="ocean-column">
      <div class="surface-band">
        <div class="wave-line"></div>
        <div class="wave-line second"></div>
      </div>
    </div>
  </div>

  <div class="rush-lines" id="rush-lines" aria-hidden="true"></div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <div class="ui-shell">
    <div class="wrap" id="wrap">
      <aside class="depth-rail-box" aria-label="Depth meter">
        <span class="rail-tag">0m</span>
        <div class="rail-track"></div>
        <div class="krill-diver" id="krill-diver">🦐</div>
        <span class="rail-tag">700km</span>
      </aside>

      <main class="panel">
        <div class="top">
          <span class="pill" id="prompt-count">Prompts: 0</span>
          <span class="pill" id="session-mode">Daily Dive</span>
        </div>

        <div class="stats">
          <div class="stat"><small>Round</small><strong id="round-val">1 / 7</strong></div>
          <div class="stat"><small>Timer</small><strong id="timer-val">30s</strong></div>
          <div class="stat"><small>Depth</small><strong id="depth-val">0m</strong></div>
        </div>

        <div id="play-area">
          <div class="cat" id="cat-val">Category</div>
          <div class="question" id="question-val">Loading...</div>
          <form id="guess-form">
            <input id="guess-input" type="text" autocomplete="off" placeholder="Type a real-life answer..." required />
            <button type="submit" id="guess-btn">Dive</button>
          </form>
          <div class="suggestion-box" id="suggestion-box" hidden></div>
          <div class="msg" id="msg-val"></div>
        </div>

        <div class="results" id="results-area" hidden></div>
      </main>
    </div>
  </div>

    (function populateOceanMarkers() {
      const col = document.getElementById("ocean-column");
      const landmarks = {
        1: "200m · Sunlight Zone Ends",
        3: "1,000m · Midnight Zone",
        6: "3,800m · RMS Titanic Wreck",
        10: "10,994m · Challenger Deep",
        16: "20,000m · Oceanic Crust",
        25: "40,000m · Subduction Trench",
        38: "80,000m · Upper Mantle",
        52: "150,000m · Deep Asthenosphere",
        68: "300,000m · Thermal Abyss",
        84: "500,000m · Planetary Core Edge",
        97: "700,000m · Bottom of the World"
      };

      for (let pct = 1; pct <= 99; pct += 1) {
        const m = document.createElement("div");
        const metersLabel = Math.round((pct / 100) * 700000).toLocaleString() + "m";
        if (landmarks[pct]) {
          m.className = "depth-marker major";
          m.textContent = landmarks[pct];
        } else {
          m.className = "depth-marker";
          m.textContent = `${metersLabel} · Sinking`;
        }
        m.style.top = `${pct}%`;
        col.appendChild(m);
      }
    })();

          ["folding clothes", 0.82], ["mowing the lawn", 0.76], ["cleaning the fridge", 0.66],
          ["washing windows", 0.62], ["weeding", 0.60], ["scrubbing the oven", 0.54], ["making the bed", 0.72],

        ]
      },
      {

        question: "A classic movie trope or cliché",
        answers: [
          ["walking away from explosions", 0.88], ["love at first sight", 0.86], ["hacking in seconds", 0.80],
          ["splitting up in a horror movie", 0.84], ["car won't start", 0.82], ["villain monologue", 0.78],

          ["fake death", 0.68], ["amnesia", 0.64], ["training montage", 0.70], ["airport chase", 0.66],
          ["chosen one", 0.75], ["last second bomb defusal", 0.72], ["enhance image", 0.56],
          ["wilhelm scream", 0.32], ["red barrel explodes", 0.36], ["coughing means sick", 0.52],
          ["no one says goodbye on phone", 0.48], ["infinite ammo", 0.58], ["nerdy makeover", 0.54],
          ["manic pixie dream girl", 0.28], ["chekhov's gun", 0.24], ["post credits scene", 0.50]
        ]
      },
      {
        category: "Health & Body",
        question: "Something a doctor or dentist always asks you",
        answers: [
          ["do you floss", 0.94], ["do you smoke", 0.90], ["do you exercise", 0.88], ["any allergies", 0.86],
          ["how much do you drink", 0.84], ["are you taking any medication", 0.82], ["what brings you in", 0.85],
          ["does this hurt", 0.80], ["how are you sleeping", 0.74], ["when was your last visit", 0.76],
          ["family history", 0.70], ["diet", 0.72], ["stress levels", 0.66], ["pain scale", 0.68],
          ["are you pregnant", 0.64], ["how much water do you drink", 0.60], ["have you traveled recently", 0.54],
          ["when did symptoms start", 0.72], ["do you grind your teeth", 0.48], ["any surgeries", 0.58],
          ["open wide", 0.78], ["take a deep breath", 0.74], ["any headaches", 0.52]
        ]
      },
      {
        category: "Money & Shopping",
        question: "An impulse buy at the grocery store checkout",
        answers: [
          ["gum", 0.95], ["chocolate", 0.93], ["candy", 0.92], ["mints", 0.88], ["magazine", 0.84],
          ["soda", 0.82], ["chips", 0.80], ["chapstick", 0.74], ["lighter", 0.68], ["batteries", 0.70],
          ["energy drink", 0.76], ["water bottle", 0.72], ["lottery ticket", 0.66], ["gift card", 0.62],
          ["hand sanitizer", 0.60], ["tissues", 0.56], ["protein bar", 0.64], ["donuts", 0.58],
          ["reusable bag", 0.54], ["breath strips", 0.42], ["scratch card", 0.64], ["toy", 0.48],
          ["tabloid", 0.52], ["tic tacs", 0.78], ["snickers", 0.80], ["beef jerky", 0.50]
        ]
      }
    ];

    // Build global vocabulary for fuzzy "Did you mean?" matching + strict cross-category checks
    const ALL_KNOWN_PHRASES = [];
    const PROMPT_ITEM_MAP = new Map();

    REAL_LIFE_PROMPTS.forEach((p, idx) => {
      for (const [ans, pop] of p.answers) {
        const clean = ans.trim().toLowerCase();
        ALL_KNOWN_PHRASES.push(clean);
        if (!PROMPT_ITEM_MAP.has(clean)) PROMPT_ITEM_MAP.set(clean, new Set());
        PROMPT_ITEM_MAP.get(clean).add(idx);
      }
    });

    const UNIQUE_KNOWN_PHRASES = Array.from(new Set(ALL_KNOWN_PHRASES));

    document.getElementById("prompt-count").textContent = `Prompts: ${REAL_LIFE_PROMPTS.length} Real-Life Topics`;

    (function spawnEffects() {
      const box = document.getElementById("bubbles");
      for (let i = 0; i < 32; i++) {
        const el = document.createElement("span");
        el.className = "bubble";
        const size = 6 + Math.random() * 14;
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${Math.random() * 100}%`;
        el.style.animationDuration = `${5 + Math.random() * 7}s`;
        el.style.animationDelay = `${-Math.random() * 10}s`;
        box.appendChild(el);
      }

      const rushBox = document.getElementById("rush-lines");
      for (let i = 0; i < 48; i++) {
        const st = document.createElement("span");
        st.className = "streak";
        st.style.left = `${Math.random() * 100}%`;
        st.style.animationDuration = `${0.32 + Math.random() * 0.35}s`;
        st.style.animationDelay = `${-Math.random() * 0.8}s`;
        rushBox.appendChild(st);
      }
    })();

    // Levenshtein distance for close-word detection
    function editDistance(a, b) {
      if (a === b) return 0;
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function findClosestSuggestion(rawInput, curPrompt) {
      const clean = norm(rawInput);
      if (!clean || clean.length < 3) return null;

      // Prioritize answers from the current prompt first, then all known words
      const promptCandidates = curPrompt.answers.map(([a]) => norm(a));
      const pool = Array.from(new Set([...promptCandidates, ...UNIQUE_KNOWN_PHRASES]));

      let bestWord = null;
      let bestScore = Infinity;

      for (const candidate of pool) {
        if (candidate === clean) continue;
        const dist = editDistance(clean, candidate);
        const maxAllowed = candidate.length <= 5 ? 1 : candidate.length <= 9 ? 2 : 3;
        if (dist <= maxAllowed && dist < bestScore) {
          bestScore = dist;
          bestWord = candidate;
        }
      }

      return bestWord;
    }

    const dictCache = new Map();

    async function checkDictionaryPhrase(phrase) {
      const clean = phrase.trim().toLowerCase().replace(/\s+/g, " ");
      if (!/^[a-z]+([ '-][a-z]+)*$/i.test(clean)) return false;

      const words = clean.split(/[\s-]+/).filter(Boolean);
      if (words.length === 0) return false;

      // Require every non-trivial word in a phrase to be a real English word
      for (const token of words) {
        if (token.length === 1 && token !== "a" && token !== "i") return false;
        if (dictCache.has(token)) {
          if (!dictCache.get(token)) return false;
          continue;
        }
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2400);
          const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(token)}`, {
            signal: controller.signal
          });
          clearTimeout(timer);
          dictCache.set(token, res.ok);
          if (!res.ok) return false;
        } catch {
          if (!/^[a-z]{2,}$/i.test(token)) return false;
          dictCache.set(token, true);
        }
      }

      return true;
    }

    function pointsFromRarity(pop) {
      const rarity = Math.max(0.05, Math.min(1, 1 - pop));
      if (rarity >= 0.85) return 100;
      if (rarity >= 0.68) return 64;
      if (rarity >= 0.48) return 32;
      if (rarity >= 0.28) return 16;
      if (rarity >= 0.14) return 8;
      return 4;
    }

    function tierNameForPoints(pts) {
      if (pts >= 100) return "One in a Krillion";
      if (pts >= 64) return "Deep Cut";
      if (pts >= 32) return "Rare";
      if (pts >= 16) return "Schooler";
      if (pts >= 8) return "Too Clever";
      return "Plankton";
    }

    function rarityFromPhrase(text) {
      const letters = text.trim().replace(/[^a-zA-Z]/g, "").toLowerCase();
      const uncommon = new Set(["q", "x", "z", "j", "k", "v", "w", "y"]);
      let rareChars = 0;
      for (const c of letters) if (uncommon.has(c)) rareChars++;
      const isPhrase = text.trim().split(/\s+/).length >= 2 ? 0.12 : 0;
      const lenBoost = Math.min(0.45, Math.max(0, (letters.length - 4) * 0.05));
      const charBoost = Math.min(0.35, rareChars * 0.15);
      return Math.max(0.08, Math.min(0.85, 0.74 - lenBoost - charBoost - isPhrase));
    }

    function hashSeed(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function pickSeven(seedStr) {
      let s = hashSeed(seedStr) || 1;
      const pool = REAL_LIFE_PROMPTS.map((p, idx) => ({ ...p, idx }));
      const selected = [];
      while (selected.length < 7 && pool.length > 0) {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        selected.push(pool.splice(s % pool.length, 1)[0]);
      }
      return selected;
    }

    const TOTAL_ROUNDS = 7;
    const ROUND_TIME = 30;
    const METERS_PER_POINT = 1000;
    const MAX_SCALE_DEPTH = 700000;

    let deck = [];
    let round = 0;
    let score = 0;
    let displayedMeters = 0;
    let timeLeft = ROUND_TIME;
    let countdown = null;
    let nextRoundTimer = null;
    let log = [];
    let busy = false;

    const bubblesEl = document.getElementById("bubbles");
    const rushLinesEl = document.getElementById("rush-lines");
    const wrapEl = document.getElementById("wrap");
    const sessionModeEl = document.getElementById("session-mode");
    const roundValEl = document.getElementById("round-val");
    const timerValEl = document.getElementById("timer-val");
    const depthValEl = document.getElementById("depth-val");
    const catValEl = document.getElementById("cat-val");
    const questionValEl = document.getElementById("question-val");
    const formEl = document.getElementById("guess-form");
    const inputEl = document.getElementById("guess-input");
    const btnEl = document.getElementById("guess-btn");
    const suggestionBoxEl = document.getElementById("suggestion-box");
    const msgEl = document.getElementById("msg-val");
    const playAreaEl = document.getElementById("play-area");
    const resultsAreaEl = document.getElementById("results-area");
    const krillDiverEl = document.getElementById("krill-diver");
    const railBoxEl = document.querySelector(".depth-rail-box");

    function norm(s) {
      return s.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function matchPromptAnswers(cur, raw) {
      const n = norm(raw);
      if (!n) return null;
      for (const [ans, pop] of cur.answers) {
        const cleanAns = norm(ans);
        if (cleanAns === n) return { pop };
        const alt = n.endsWith("s") ? n.slice(0, -1) : `${n}s`;
        if (cleanAns === alt) return { pop: Math.min(0.95, pop + 0.04) };
      }
      return null;
    }

    function showSuggestion(word) {
      if (!word) {
        suggestionBoxEl.hidden = true;
        suggestionBoxEl.innerHTML = "";
        return;
      }
      suggestionBoxEl.hidden = false;
      suggestionBoxEl.innerHTML = `
        <span>Did you mean:</span>
        <button type="button" class="suggestion-btn" id="use-suggestion-btn">${word}</button>
        <span>?</span>
      `;
      document.getElementById("use-suggestion-btn").onclick = () => {
        inputEl.value = word;
        suggestionBoxEl.hidden = true;
        handleGuess(word, false);
      };
    }

    function animateDepthCounter(targetMeters) {
      const start = displayedMeters;
      const diff = targetMeters - start;
      if (diff === 0) {
        depthValEl.textContent = `${targetMeters.toLocaleString()}m`;
        return;
      }
      const duration = 1400;
      const startTime = performance.now();
      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        displayedMeters = Math.round(start + diff * eased);
        depthValEl.textContent = `${displayedMeters.toLocaleString()}m`;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function descendOcean(meters, gainedPts) {
      const ratio = Math.min(1, meters / MAX_SCALE_DEPTH);
      const colShiftVh = -(ratio * 24900);
      document.documentElement.style.setProperty("--column-y", `${colShiftVh}vh`);

      const h = railBoxEl ? railBoxEl.clientHeight : 390;
      const topStart = 34;
      const topEnd = Math.max(topStart + 20, h - 56);
      krillDiverEl.style.top = `${topStart + ratio * (topEnd - topStart)}px`;

      animateDepthCounter(meters);
      depthValEl.classList.remove("bump");
      void depthValEl.offsetWidth;
      depthValEl.classList.add("bump");

      if (gainedPts > 0) {
        const dropPx = Math.min(220, 65 + Math.round((gainedPts / 100) * 155));
        document.documentElement.style.setProperty("--ui-drop", `${dropPx}px`);
        document.documentElement.style.setProperty("--ui-scale", "0.94");
        krillDiverEl.classList.add("sink-drop");
        rushLinesEl.classList.add("active");
        bubblesEl.classList.add("turbo");
        wrapEl.classList.remove("rumble");
        void wrapEl.offsetWidth;
        wrapEl.classList.add("rumble");

        setTimeout(() => {
          document.documentElement.style.setProperty("--ui-drop", "0px");
          document.documentElement.style.setProperty("--ui-scale", "1");
        }, 1150);

        setTimeout(() => {
          krillDiverEl.classList.remove("sink-drop");
          rushLinesEl.classList.remove("active");
          bubblesEl.classList.remove("turbo");
        }, 2000);
      }
    }

    function startGame(mode = "daily") {
      clearInterval(countdown);
      clearTimeout(nextRoundTimer);
      busy = false;

      const today = new Date().toISOString().slice(0, 10);
      const seed = mode === "daily" ? `daily-${today}` : `free-${Date.now()}-${Math.random()}`;
      sessionModeEl.textContent = mode === "daily" ? `Daily (${today})` : "Free Dive";

      deck = pickSeven(seed);
      round = 0;
      score = 0;
      displayedMeters = 0;
      log = [];
      msgEl.textContent = "";
      suggestionBoxEl.hidden = true;
      resultsAreaEl.hidden = true;
      playAreaEl.hidden = false;
      descendOcean(0, 0);
      runRound();
    }

    function runRound() {
      if (round >= TOTAL_ROUNDS || round >= deck.length) {
        showResults();
        return;
      }

      busy = false;
      const cur = deck[round];
      roundValEl.textContent = `${round + 1} / ${TOTAL_ROUNDS}`;
      catValEl.textContent = cur.category;
      questionValEl.textContent = cur.question;
      inputEl.value = "";
      inputEl.disabled = false;
      btnEl.disabled = false;
      suggestionBoxEl.hidden = true;
      msgEl.textContent = "";
      inputEl.focus();

      timeLeft = ROUND_TIME;
      timerValEl.textContent = `${timeLeft}s`;
      clearInterval(countdown);
      countdown = setInterval(() => {
        timeLeft -= 1;
        timerValEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          handleGuess("", true);
        }
      }, 1000);
    }

    async function validateGuess(cur, raw) {
      const cleaned = raw.trim();
      const n = norm(cleaned);
      if (!n) {
        return { ok: false, reason: "Type an answer first — your turn still counts!" };
      }

      // 1. Direct match on this prompt's curated real-life list
      const direct = matchPromptAnswers(cur, cleaned);
      if (direct) {
        return { ok: true, pop: direct.pop, extra: "" };
      }

      // 2. Check if it's a valid English word/phrase
      const inDict = await checkDictionaryPhrase(cleaned);
      if (!inDict) {
        const close = findClosestSuggestion(cleaned, cur);
        return {
          ok: false,
          reason: `"${cleaned}" isn't recognized in the English dictionary — try again (turn kept)!`,
          suggestion: close
        };
      }

      // 3. Check if it clearly belongs to a completely different prompt instead of this one
      const mappedPrompts = PROMPT_ITEM_MAP.get(n);
      if (mappedPrompts && !mappedPrompts.has(cur.idx)) {
        const close = findClosestSuggestion(cleaned, cur);
        return {
          ok: false,
          reason: `"${cleaned}" doesn't fit this prompt — try again (turn kept)!`,
          suggestion: close
        };
      }

      // 4. Valid English word/phrase that fits the real-life prompt
      return {
        ok: true,
        pop: rarityFromPhrase(cleaned),
        extra: " · Valid English match"
      };
    }

    async function handleGuess(raw, timedOut = false) {
      if (busy) return;
      busy = true;
      inputEl.disabled = true;
      btnEl.disabled = true;
      suggestionBoxEl.hidden = true;

      const cur = deck[round];
      const cleaned = raw.trim();

      if (timedOut) {
        clearInterval(countdown);
        msgEl.innerHTML = `<span class="bad">Time's up! +0 pts</span>`;
        log.push({ q: cur.question, ans: "—", pts: 0 });
        round += 1;
        nextRoundTimer = setTimeout(runRound, 1800);
        return;
      }

      msgEl.innerHTML = `<span class="warn">Checking answer...</span>`;
      const res = await validateGuess(cur, cleaned);

      if (!res.ok) {
        // Do NOT count as a go — keep the current round and timer active!
        busy = false;
        inputEl.disabled = false;
        btnEl.disabled = false;
        inputEl.focus();
        inputEl.select();
        msgEl.innerHTML = `<span class="bad">${res.reason}</span>`;
        showSuggestion(res.suggestion || null);
        return;
      }

      // Valid answer — advance round and plunge!
      clearInterval(countdown);
      const pts = pointsFromRarity(res.pop);
      const tier = tierNameForPoints(pts);
      const cls = pts >= 32 ? "ok" : "warn";
      const dropMeters = pts * METERS_PER_POINT;

      msgEl.innerHTML = `<span class="${cls}"><strong>"${cleaned}"</strong>${res.extra} — <strong>${tier}</strong> (+${pts} pts / -${dropMeters.toLocaleString()}m)</span>`;

      score += pts;
      descendOcean(score * METERS_PER_POINT, pts);
      log.push({ q: cur.question, ans: cleaned, pts });

      round += 1;
      nextRoundTimer = setTimeout(runRound, 2100);
    }

    function showResults() {
      clearInterval(countdown);
      clearTimeout(nextRoundTimer);
      playAreaEl.hidden = true;
      resultsAreaEl.hidden = false;

      const totalMeters = score * METERS_PER_POINT;
      const listHtml = log
        .map((entry) => `<li>${entry.q} — <strong>${entry.ans}</strong> (<em>+${entry.pts} pts / ${(entry.pts * METERS_PER_POINT).toLocaleString()}m</em>)</li>`)
        .join("");

      resultsAreaEl.innerHTML = `
        <h2>Dive Complete!</h2>
        <p>Score: <strong>${score} pts</strong> · Max Depth: <strong>${totalMeters.toLocaleString()}m</strong></p>
        <ul>${listHtml}</ul>
        <div class="actions">
          <button type="button" onclick="startGame('free')">Play Another 7 Rounds</button>
          <button type="button" class="ghost" onclick="startGame('daily')">Replay Daily</button>
        </div>
      `;
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      handleGuess(inputEl.value, false);
    });

    startGame("daily");
  </script>
